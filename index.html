<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xalient Toolkit</title>
<meta name="description" content="Interactive briefings — AI adoption, PKI &amp; certificate lifecycle, and post-quantum cryptography.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#110F51;
    --pink:#FF0085;
    --teal:#00D5CB;
    --gray-blue:#879FAC;
    --bg:#FFFFFF;
    --bg-soft:#F7F8FA;
    --border:#E3E7EC;
    --ink:#23213D;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .mono{font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;}
  h1,h2,h3{margin:0;}
  a{color:inherit;}

  header.site-header{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;
    padding:16px 44px;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  header.site-header img{height:24px;display:block;}
  header.site-header .brand-sub{
    margin-left:12px;padding-left:12px;border-left:1px solid var(--border);
    font-size:12px;color:var(--gray-blue);font-weight:600;letter-spacing:.02em;
  }

  .wrap{max-width:1040px;margin:0 auto;padding:0 44px;}

  /* Hero */
  .hero{position:relative;padding:96px 0 72px;overflow:hidden;}
  .hero-field{position:absolute;inset:0;pointer-events:none;z-index:0;}
  .drift-dot{
    position:absolute;border-radius:50%;
    background:var(--teal);opacity:.14;
    animation:drift 14s ease-in-out infinite;
  }
  .drift-dot.pink{background:var(--pink);}
  @keyframes drift{
    0%,100%{transform:translateY(0) scale(1);}
    50%{transform:translateY(-26px) scale(1.15);}
  }
  .hero-inner{position:relative;z-index:1;}
  .eyebrow{
    display:inline-block;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    color:var(--gray-blue);margin-bottom:20px;
  }
  .hero h1{
    font-size:50px;line-height:1.12;letter-spacing:-.02em;font-weight:800;
    color:var(--navy);max-width:17ch;text-wrap:balance;margin-bottom:22px;
  }
  .hero-sub{font-size:17.5px;line-height:1.6;color:var(--gray-blue);max-width:60ch;}

  /* Topic grid */
  .topics{padding:16px 0 100px;}
  .topics-label{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gray-blue);margin-bottom:24px;}
  .topic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}

  .topic-card{
    position:relative;display:flex;flex-direction:column;
    border:1px solid var(--border);border-radius:16px;background:#fff;
    padding:28px 26px;text-decoration:none;min-height:230px;
    transition:border-color .2s ease, box-shadow .2s ease, transform .2s ease;
  }
  .topic-card.live:hover{border-color:var(--teal);box-shadow:0 16px 32px -20px rgba(17,15,81,.35);transform:translateY(-3px);}
  .topic-card.soon{cursor:default;opacity:.7;}

  .topic-icon{
    width:44px;height:44px;border-radius:11px;background:var(--bg-soft);
    display:flex;align-items:center;justify-content:center;color:var(--navy);margin-bottom:22px;
  }
  .topic-card.live .topic-icon{background:#E1FBF9;color:var(--teal);}
  .topic-icon svg{width:22px;height:22px;}

  .topic-title{font-weight:800;color:var(--navy);font-size:18px;margin-bottom:10px;}
  .topic-desc{font-size:14px;line-height:1.6;color:var(--ink);flex:1;}

  .topic-meta{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:20px;padding-top:16px;border-top:1px solid var(--border);
    font-size:12px;font-weight:700;
  }
  .topic-meta .go{
    display:inline-flex;align-items:center;gap:5px;color:var(--teal);
    transition:transform .18s ease;
  }
  .topic-card.live:hover .go{transform:translateX(3px);}
  .topic-badge{
    font-family:ui-monospace,monospace;font-size:10.5px;font-weight:700;letter-spacing:.03em;
    color:var(--gray-blue);background:var(--bg-soft);border-radius:20px;padding:3px 10px;
  }

  footer{background:var(--navy);color:#EDEEF7;text-align:center;padding:26px 44px;font-size:12px;opacity:.9;}

  @media (max-width:860px){
    .topic-grid{grid-template-columns:1fr;}
  }
  @media (max-width:720px){
    .wrap{padding:0 22px;}
    header.site-header{padding:14px 22px;}
    .hero{padding:64px 0 48px;}
    .hero h1{font-size:34px;}
  }
</style>
</head>
<body>

<header class="site-header">
  <img src="xalient-logo.png" alt="Xalient">
  <span class="brand-sub">Toolkit</span>
</header>

<section class="hero">
  <div class="hero-field" id="hero-field"></div>
  <div class="wrap hero-inner">
    <h1 class="display">Briefings</h1>
    <p class="hero-sub">Select a topic below.</p>
  </div>
</section>

<section class="topics">
  <div class="wrap">
    <div class="topics-label mono">BRIEFINGS</div>
    <div class="topic-grid" id="topic-grid"></div>
  </div>
</section>

<footer>
  Xalient · Interactive briefing toolkit — for use in customer conversations only
</footer>

<script>
(function(){
  "use strict";

  var heroField = document.getElementById('hero-field');
  for (var i = 0; i < 14; i++){
    var d = document.createElement('div');
    d.className = 'drift-dot' + (i % 3 === 0 ? ' pink' : '');
    var size = 6 + Math.random() * 20;
    d.style.width = size + 'px';
    d.style.height = size + 'px';
    d.style.left = (Math.random() * 100) + '%';
    d.style.top = (Math.random() * 100) + '%';
    d.style.animationDuration = (10 + Math.random() * 10) + 's';
    d.style.animationDelay = (Math.random() * -14) + 's';
    heroField.appendChild(d);
  }

  var ICONS = {
    ai: '<circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 20c0-3.87 3.13-6 7-6s7 2.13 7 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M19 5l1.3 1.3M20.3 3.7L19 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>',
    pki: '<circle cx="8" cy="14" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11.2 10.8L20 2M20 2v4.5M20 2h-4.5M15.5 6.5L18 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
    pqc: '<circle cx="12" cy="12" r="2" fill="currentColor"/><ellipse cx="12" cy="12" rx="9" ry="4" fill="none" stroke="currentColor" stroke-width="1.5"/><ellipse cx="12" cy="12" rx="9" ry="4" fill="none" stroke="currentColor" stroke-width="1.5" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="4" fill="none" stroke="currentColor" stroke-width="1.5" transform="rotate(120 12 12)"/>'
  };

  var TOPICS = [
    {
      title:'AI Adoption &amp; Guardrails',
      desc:'How enterprises are adopting AI, where visibility breaks down, and the guardrails that close the gap — including a live incident scenario.',
      icon:'ai', href:'ai-adoption-guardrails.html', live:true,
      meta:'3 pages · incident scenario'
    },
    {
      title:'PKI &amp; Certificate Lifecycle Management',
      desc:'Certificate lifetimes are being cut from 398 days to 47 on a fixed industry schedule — what that means operationally, and the readiness timeline to get ahead of it.',
      icon:'pki', href:'pki-clm.html', live:true,
      meta:'1 page · live countdown'
    },
    {
      title:'Post-Quantum Cryptography',
      desc:'Harvest Now, Decrypt Later means the exposure clock already started. The real math gap, the finalized NIST standards, and the migration deadlines already in motion.',
      icon:'pqc', href:'pqc.html', live:true,
      meta:'1 page · live countdown'
    }
  ];

  var grid = document.getElementById('topic-grid');
  TOPICS.forEach(function(t){
    var el = document.createElement(t.live ? 'a' : 'div');
    el.className = 'topic-card ' + (t.live ? 'live' : 'soon');
    if (t.live) el.setAttribute('href', t.href);
    el.innerHTML =
      '<div class="topic-icon"><svg viewBox="0 0 24 24">' + ICONS[t.icon] + '</svg></div>' +
      '<div class="topic-title display">' + t.title + '</div>' +
      '<div class="topic-desc">' + t.desc + '</div>' +
      '<div class="topic-meta">' +
        '<span class="topic-badge">' + t.meta + '</span>' +
        (t.live ? '<span class="go">Open<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' : '') +
      '</div>';
    grid.appendChild(el);
  });

  var revealEls = document.querySelectorAll('.hero, .topics');
  revealEls.forEach(function(s){ s.style.opacity = '0'; s.style.transform = 'translateY(16px)'; s.style.transition = 'opacity .7s ease, transform .7s ease'; });
  if ('IntersectionObserver' in window){
    var observer = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (entry.isIntersecting){
          entry.target.style.opacity = '1';
          entry.target.style.transform = 'translateY(0)';
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.06 });
    revealEls.forEach(function(s){ observer.observe(s); });
  } else {
    revealEls.forEach(function(s){ s.style.opacity = '1'; s.style.transform = 'none'; });
  }
})();
</script>
</body>
</html>
